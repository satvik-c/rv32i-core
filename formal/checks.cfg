[options]
isa rv32i

[depth]
insn            20
# shallowed from 15 25: didn't converge in 30+ min at that depth (solver limit)
reg        5    12
pc_fwd    10    30
pc_bwd    10    30
unique    1  10 30
causal    10    30
liveness  1  10 30
cover     1     15

[defines]
`define RISCV_FORMAL
`define RISCV_FORMAL_NRET 1
`define RISCV_FORMAL_XLEN 32
`define RISCV_FORMAL_ILEN 32
`define RISCV_FORMAL_ALIGNED_MEM

[script-sources]
# sv2v output from formal/build.sh; core_pkg.sv has no output (inlined)
read_verilog /home/radude184/Documents/hdl-coding/rv32i-core/formal/build/alu.v
read_verilog /home/radude184/Documents/hdl-coding/rv32i-core/formal/build/alu_dec.v
read_verilog /home/radude184/Documents/hdl-coding/rv32i-core/formal/build/branch_logic.v
read_verilog /home/radude184/Documents/hdl-coding/rv32i-core/formal/build/controller.v
read_verilog /home/radude184/Documents/hdl-coding/rv32i-core/formal/build/datapath.v
read_verilog /home/radude184/Documents/hdl-coding/rv32i-core/formal/build/fault_ctrl.v
read_verilog /home/radude184/Documents/hdl-coding/rv32i-core/formal/build/imm_gen.v
read_verilog /home/radude184/Documents/hdl-coding/rv32i-core/formal/build/lsu.v
read_verilog /home/radude184/Documents/hdl-coding/rv32i-core/formal/build/main_dec.v
read_verilog /home/radude184/Documents/hdl-coding/rv32i-core/formal/build/reg_file.v
read_verilog /home/radude184/Documents/hdl-coding/rv32i-core/formal/build/stall_ctrl.v
read_verilog /home/radude184/Documents/hdl-coding/rv32i-core/formal/build/rv32i_core.v
# read as real SV, not sv2v output, to preserve assume()
read_verilog -sv /home/radude184/Documents/hdl-coding/rv32i-core/formal/rvfi_wrapper.sv

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);
